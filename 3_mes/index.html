<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felices 3 Meses Daniel 💗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;overflow-x:hidden;overflow-y:scroll;}
body{
  background:radial-gradient(ellipse at 50% 60%,#1a0a2e 0%,#0a0015 70%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  font-family:Georgia,serif;
  position:relative;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) var(--dl) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0);}50%{opacity:var(--op);transform:scale(1);}}

.page{
  position:relative;z-index:10;
  width:100%;max-width:420px;
  display:flex;flex-direction:column;
  align-items:center;
  padding-top:2.5rem;
}

.letter-space{
  width:268px;height:0;
  transition:height 0.75s 0.35s cubic-bezier(.4,0,.2,1);
  overflow:visible;position:relative;z-index:25;
}
.letter-space.open{height:230px;}

.letter{
  position:absolute;top:0;left:0;right:0;
  background:#fff9fb;border-radius:8px;
  padding:1.2rem 1.3rem 1rem;
  box-shadow:0 2px 20px rgba(180,60,90,0.15);
  opacity:0;transform:translateY(30px);
  transition:opacity 0.4s 0.6s, transform 0.5s 0.5s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.letter-space.open .letter{opacity:1;transform:translateY(0);pointer-events:auto;}

.letter-title{
  font-family:'Trebuchet MS','Gill Sans',sans-serif;
  font-size:1rem;font-weight:700;
  color:#c0305a;text-align:center;
  letter-spacing:0.06em;line-height:1.45;
  margin-bottom:0.5rem;white-space:pre-line;min-height:2.9em;
}
.letter-divider{width:50px;height:1px;background:linear-gradient(to right,transparent,#e896b0,transparent);margin:0 auto 0.6rem;}
.letter-poem{
  font-size:0.74rem;color:#7a2040;
  font-style:italic;line-height:1.82;
  text-align:center;white-space:pre-line;min-height:8em;
}
.letter-author{
  font-size:0.65rem;color:#b05070;
  text-align:right;margin-top:0.5rem;
  letter-spacing:0.05em;opacity:0;transition:opacity 0.7s;
}
.letter-author.show{opacity:1;}
.cursor{display:inline-block;width:2px;height:0.9em;background:#c0305a;vertical-align:text-bottom;animation:blink 0.75s step-end infinite;margin-left:1px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* Etiqueta sobre */
.sobre-etiqueta{
  display:flex;flex-direction:column;
  align-items:center;gap:0.2rem;
  margin-bottom:0.6rem;
  font-family:'Georgia',serif;
  font-style:italic;font-size:0.82rem;
  color:rgba(255,180,200,0.85);
  letter-spacing:0.08em;
  text-shadow:0 0 12px rgba(255,100,150,0.4);
}

.envelope-wrapper{position:relative;width:300px;height:210px;z-index:20;}
.envelope-body{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#f4b8cc 0%,#f0a0bc 100%);
  border-radius:4px 4px 16px 16px;
  box-shadow:0 8px 40px rgba(200,60,100,0.25);
  z-index:1;overflow:hidden;
}
.env-left{position:absolute;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 105px 150px;border-color:transparent transparent #e8849f transparent;}
.env-right{position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:0 150px 105px 0;border-color:transparent #e8849f transparent transparent;}
.envelope-lid{
  position:absolute;top:0;left:0;right:0;height:0;
  border-style:solid;border-width:110px 150px 0 150px;
  border-color:#e896b0 transparent transparent transparent;
  transform-origin:top center;
  transition:transform 0.65s cubic-bezier(.4,0,.2,1);z-index:3;
}
.envelope-wrapper.open .envelope-lid{transform:rotateX(180deg);}

.btn-open{
  margin-top:1.3rem;margin-bottom:2rem;
  background:rgba(240,140,170,0.15);
  border:1.5px solid rgba(240,140,170,0.45);
  color:#ffcce0;font-family:Georgia,serif;
  font-size:0.85rem;letter-spacing:0.15em;
  padding:0.55rem 2.2rem;border-radius:50px;
  cursor:pointer;transition:all 0.3s;text-transform:uppercase;
}
.btn-open:hover{background:rgba(240,140,170,0.28);}

.ground{width:100%;height:95px;background:linear-gradient(to top,#0d1a0a 0%,#122010 55%,transparent 100%);position:relative;z-index:15;flex-shrink:0;}
.grass-container{position:absolute;top:-28px;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 8px;}
.grass-blade{width:5px;background:linear-gradient(to top,#1a3a12,#2d6020);border-radius:3px 3px 0 0;transform-origin:bottom center;animation:sway 2.5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
.flowers-row{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:16px;z-index:16;}
.tulip{display:flex;flex-direction:column;align-items:center;transform-origin:bottom center;animation:tulipSway var(--ts,3s) var(--td,0s) ease-in-out infinite;}
@keyframes tulipSway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
.tulip-stem{width:5px;background:linear-gradient(to top,#1a3a12,#2d7020);border-radius:3px;position:relative;}
.tulip-leaf{position:absolute;width:20px;height:10px;background:linear-gradient(135deg,#2d7020,#4aaa30);border-radius:50% 0 50% 0;}
.tulip-leaf.l{left:-18px;}
.tulip-leaf.r{right:-18px;transform:scaleX(-1);}
.tulip-top{position:relative;width:34px;height:38px;margin-bottom:1px;}
.tulip-petal-outer{position:absolute;bottom:0;width:14px;height:32px;border-radius:50% 50% 20% 20%;background:var(--tc,#d42040);}
.tulip-petal-outer.p1{left:0;transform:rotate(-18deg);transform-origin:bottom center;filter:brightness(0.88);}
.tulip-petal-outer.p2{left:50%;transform:translateX(-50%);transform-origin:bottom center;}
.tulip-petal-outer.p3{right:0;transform:rotate(18deg);transform-origin:bottom center;filter:brightness(0.88);}
.tulip-petal-inner{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:12px;height:26px;border-radius:50% 50% 20% 20%;background:var(--ti,#f06080);z-index:2;}
.sp-dot{position:absolute;width:4px;height:4px;border-radius:50%;animation:spAnim var(--spd,1.4s) var(--spdl,0s) ease-in-out infinite;}
@keyframes spAnim{0%,100%{opacity:0;transform:scale(0) translate(0,0);}50%{opacity:1;transform:scale(1) translate(var(--spx,0px),var(--spy,-14px));}}
.fheart{position:fixed;font-size:var(--fhs,16px);opacity:0;animation:floatUp var(--fhd,6s) var(--fhdl,0s) ease-in infinite;pointer-events:none;z-index:1;}
@keyframes floatUp{0%{opacity:0;transform:translateY(0);}10%{opacity:0.55;}90%{opacity:0.15;}100%{opacity:0;transform:translateY(-90vh);}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="page">
  <div class="letter-space" id="letterSpace">
    <div class="letter" id="letter">
      <div class="letter-title" id="titleEl"></div>
      <div class="letter-divider"></div>
      <div class="letter-poem" id="poemEl"></div>
      <div class="letter-author" id="authorEl">— Mario Benedetti</div>
    </div>
  </div>

  <div class="sobre-etiqueta">
    <span>Para: Daniel Mahecha</span>
    <span>De: Lucía Torres 💗</span>
  </div>

  <div class="envelope-wrapper" id="env">
    <div class="envelope-body"><div class="env-left"></div><div class="env-right"></div></div>
    <div class="envelope-lid"></div>
  </div>

  <button class="btn-open" id="btn">Abrir 💌</button>

  <div class="ground">
    <div class="grass-container" id="grass"></div>
    <div class="flowers-row" id="flowers"></div>
  </div>
</div>

<script>
const starsEl=document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s;--op:${0.4+Math.random()*0.6};`;
  starsEl.appendChild(s);
}

const grassEl=document.getElementById('grass');
for(let i=0;i<32;i++){
  const b=document.createElement('div');b.className='grass-blade';
  b.style.cssText=`height:${14+Math.random()*22}px;animation-delay:${Math.random()*2}s;animation-duration:${1.8+Math.random()*1.5}s;`;
  grassEl.appendChild(b);
}

const flowersEl=document.getElementById('flowers');
const tulipDefs=[
  {tc:'#c41830',ti:'#e8506a',h:68,ts:2.8,td:0.0},
  {tc:'#d42050',ti:'#f070a0',h:82,ts:3.1,td:0.25},
  {tc:'#b81030',ti:'#e04060',h:90,ts:2.6,td:0.5},
  {tc:'#e03060',ti:'#ff80a8',h:74,ts:2.9,td:0.15},
  {tc:'#c01840',ti:'#e86080',h:86,ts:2.7,td:0.4},
];
const spColors=['#ffe066','#ffb3d9','#ffffff','#ffcc44','#ff9ec4'];
tulipDefs.forEach(def=>{
  const t=document.createElement('div');t.className='tulip';t.style.cssText=`--ts:${def.ts}s;--td:${def.td}s;`;
  const bw=document.createElement('div');bw.className='tulip-top';
  ['p1','p2','p3'].forEach(cls=>{const p=document.createElement('div');p.className='tulip-petal-outer '+cls;p.style.setProperty('--tc',def.tc);bw.appendChild(p);});
  const pi=document.createElement('div');pi.className='tulip-petal-inner';pi.style.setProperty('--ti',def.ti);bw.appendChild(pi);
  for(let sp=0;sp<4;sp++){
    const dot=document.createElement('div');dot.className='sp-dot';
    const angle=sp*90+Math.random()*40-20,dist=16+Math.random()*12;
    dot.style.cssText=`background:${spColors[sp%spColors.length]};top:0;left:50%;margin-left:-2px;--spd:${1.2+Math.random()*0.7}s;--spdl:${Math.random()*1.8}s;--spx:${Math.cos(angle*Math.PI/180)*dist}px;--spy:${-Math.abs(Math.sin(angle*Math.PI/180)*dist)-8}px;`;
    bw.appendChild(dot);
  }
  const stem=document.createElement('div');stem.className='tulip-stem';stem.style.height=def.h+'px';
  const ll=document.createElement('div');ll.className='tulip-leaf l';ll.style.top=Math.floor(def.h*0.35)+'px';
  const lr=document.createElement('div');lr.className='tulip-leaf r';lr.style.top=Math.floor(def.h*0.6)+'px';
  stem.appendChild(ll);stem.appendChild(lr);
  t.appendChild(bw);t.appendChild(stem);flowersEl.appendChild(t);
});

const hEmojis=['💗','💕','🌸','💓','🌷'];
for(let i=0;i<18;i++){
  const h=document.createElement('div');h.className='fheart';
  h.textContent=hEmojis[Math.floor(Math.random()*hEmojis.length)];
  h.style.cssText=`left:${Math.random()*100}%;bottom:${Math.random()*15}%;--fhs:${12+Math.random()*16}px;--fhd:${5+Math.random()*8}s;--fhdl:${Math.random()*8}s;`;
  document.body.appendChild(h);
}

function typewriter(el,text,speed,onDone){
  let i=0;
  const cursor=document.createElement('span');cursor.className='cursor';
  el.innerHTML='';el.appendChild(cursor);
  const id=setInterval(()=>{
    if(i<text.length){
      const ch=text[i];
      el.insertBefore(document.createTextNode(ch==='|'?'\n':ch),cursor);
      i++;
    } else {
      clearInterval(id);cursor.remove();
      if(onDone)onDone();
    }
  },speed);
}

const titleStr='Felices 3 meses,|amor de mi vida 💗';
const poemStr='Te quiero para volvernos locos de risa,|ebrios de nada y pasear sin prisa|por las calles, eso sí,|tomados de la mano,|mejor dicho, del corazón.';

let typed=false,isOpen=false;
const env=document.getElementById('env');
const btn=document.getElementById('btn');
const ls=document.getElementById('letterSpace');
const authorEl=document.getElementById('authorEl');

function toggle(){
  isOpen=!isOpen;
  env.classList.toggle('open',isOpen);
  ls.classList.toggle('open',isOpen);
  btn.textContent=isOpen?'Cerrar 💌':'Abrir 💌';
  if(isOpen&&!typed){
    typed=true;
    setTimeout(()=>{
      typewriter(document.getElementById('titleEl'),titleStr,55,()=>{
        setTimeout(()=>{
          typewriter(document.getElementById('poemEl'),poemStr,40,()=>{
            authorEl.classList.add('show');
          });
        },300);
      });
    },800);
  }
}
btn.addEventListener('click',e=>{e.stopPropagation();toggle();});
env.addEventListener('click',toggle);
</script>
</body>
</html>
