<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felices 7 Meses ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Great+Vibes&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;}
body{
  background:radial-gradient(ellipse at 50% 15%,#3a0a12 0%,#1a0509 55%,#0a0203 100%);
  font-family:'Playfair Display',serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}

canvas#bg{position:fixed;inset:0;z-index:0;}

/* Guirnalda de luces */
.lights-row{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:2;pointer-events:none;
  display:flex;justify-content:space-around;align-items:flex-start;padding-top:6px;
}
.light-bulb{
  width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%, #fff6c9, #ffb84d 60%, #d1471f);
  box-shadow:0 0 10px 3px rgba(255,180,80,0.7);
  animation:bulbFlicker 2.2s ease-in-out infinite alternate;
  margin-top:18px;
}
@keyframes bulbFlicker{0%{opacity:0.45;}100%{opacity:1;}}
.wire{
  position:fixed;top:14px;left:0;right:0;height:22px;z-index:1;pointer-events:none;
}

/* Confeti (corazones + pétalos) */
.falling{position:fixed;top:-30px;opacity:0;z-index:3;pointer-events:none;animation:fall linear infinite;}
@keyframes fall{
  0%{opacity:0;transform:translateY(0) translateX(0) rotate(0deg);}
  8%{opacity:0.95;}
  90%{opacity:0.6;}
  100%{opacity:0;transform:translateY(110vh) translateX(24px) rotate(340deg);}
}

.content{
  position:relative;z-index:5;
  text-align:center;
  padding:5rem 1.6rem 3rem;
  max-width:460px;
  animation:riseIn 1.6s ease forwards;
  opacity:0;
}
@keyframes riseIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.badge{
  display:inline-block;color:#ffc9c9;font-size:0.7rem;letter-spacing:0.3em;
  text-transform:uppercase;border:1px solid rgba(255,150,150,0.35);
  padding:0.4rem 1.2rem;border-radius:50px;margin-bottom:1.6rem;
  background:rgba(200,50,60,0.12);
}

.script-title{
  font-family:'Great Vibes',cursive;
  font-size:2.4rem;color:#ffd9d9;
  text-shadow:0 0 24px rgba(255,120,120,0.5);
  margin-bottom:0.3rem;
}

.title{
  font-size:2rem;color:#fff;font-weight:600;line-height:1.4;
  text-shadow:0 0 30px rgba(255,90,90,0.5);margin-bottom:0.4rem;
}
.title span{color:#ff8a8a;}

.msg{
  margin-top:1.6rem;font-size:1rem;color:rgba(255,235,235,0.88);
  font-style:italic;line-height:1.9;
}
.msg .highlight{
  display:block;margin-top:0.6rem;font-size:1.1rem;color:#ffb3b3;font-weight:600;
  font-style:normal;text-shadow:0 0 18px rgba(255,120,120,0.45);
}

.heart-icon{font-size:1.8rem;margin:1.4rem 0;animation:beat 1.3s ease-in-out infinite;}
@keyframes beat{0%,100%{transform:scale(1);}25%{transform:scale(1.15);}45%{transform:scale(1);}}

.enter-btn{
  margin-top:2rem;background:rgba(220,50,60,0.18);
  border:1px solid rgba(255,150,150,0.45);color:#ffe0e0;
  font-family:'Playfair Display',serif;font-style:italic;font-size:0.95rem;
  padding:0.75rem 2.4rem;border-radius:50px;cursor:pointer;
  letter-spacing:0.05em;transition:all 0.3s;
}
.enter-btn:hover{background:rgba(220,50,60,0.32);box-shadow:0 0 24px rgba(255,100,100,0.35);}

.hint{margin-top:1rem;font-size:0.68rem;color:rgba(255,200,200,0.4);font-style:italic;}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<svg class="wire" viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M0,4 Q100,26 200,4 T400,4" stroke="#5a2a2a" stroke-width="1.5" fill="none"/></svg>
<div class="lights-row" id="lightsRow"></div>
<div id="fallLayer"></div>

<div class="content">
  <div class="script-title">Para ti, mi amor</div>

  <div class="badge">✦ Amor y Amistad ✦</div>

  <div class="heart-icon">❤️</div>

  <div class="title">Felices <span>7 Meses</span></div>

  <div class="msg">
    En este mes tan especial de amor y amistad,
    <span class="highlight">para mi mejor amigo, mi gran amor, mi persona favorita Daniel Mahecha💕</span>
  </div>

  <button class="enter-btn" id="enterBtn">Descubrir la sorpresa ↠</button>
</div>

<script>
// Guirnalda de luces
const lightsRow=document.getElementById('lightsRow');
for(let i=0;i<14;i++){
  const b=document.createElement('div');
  b.className='light-bulb';
  b.style.animationDelay=(Math.random()*2)+'s';
  b.style.marginTop=(14+Math.sin(i*0.6)*8)+'px';
  lightsRow.appendChild(b);
}

// Confeti: corazones + pétalos cayendo
const fallLayer=document.getElementById('fallLayer');
const items=['❤️','🌹','💗','🥀','💌','✨'];
for(let i=0;i<30;i++){
  const el=document.createElement('div');
  el.className='falling';
  el.textContent=items[Math.floor(Math.random()*items.length)];
  const size=12+Math.random()*16;
  el.style.cssText=`left:${Math.random()*100}%;font-size:${size}px;animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*10}s;`;
  fallLayer.appendChild(el);
}

// Fondo con partículas suaves tipo brasa/chispa
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',()=>{resize();initParticles();});
function initParticles(){
  particles=[];
  const count=Math.floor((W*H)/9000);
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.3,
      baseAlpha:Math.random()*0.5+0.2,
      speed:Math.random()*0.02+0.005,
      phase:Math.random()*Math.PI*2,
      driftY:-(Math.random()*0.15+0.03)
    });
  }
}
initParticles();
let t=0;
function draw(){
  ctx.clearRect(0,0,W,H);
  t+=1;
  particles.forEach(p=>{
    const alpha=p.baseAlpha+Math.sin(t*p.speed+p.phase)*0.25;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,170,150,${Math.max(0,Math.min(1,alpha))})`;
    ctx.fill();
    p.y+=p.driftY;
    if(p.y<0) p.y=H;
  });
  requestAnimationFrame(draw);
}
draw();

document.getElementById('enterBtn').addEventListener('click',()=>{
  window.location.href = 'pregunta.html';
});
</script>
</body>
</html>
