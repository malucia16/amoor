<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felices 7 Meses ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;}
body{
  background:radial-gradient(ellipse at 50% 15%,#3a0a12 0%,#1a0509 55%,#0a0203 100%);
  font-family:'Playfair Display',serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}

canvas#bg{position:fixed;inset:0;z-index:0;}
.falling{position:fixed;top:-30px;opacity:0;z-index:2;pointer-events:none;animation:fall linear infinite;}
@keyframes fall{
  0%{opacity:0;transform:translateY(0) translateX(0) rotate(0deg);}
  8%{opacity:0.9;}90%{opacity:0.55;}
  100%{opacity:0;transform:translateY(110vh) translateX(20px) rotate(320deg);}
}

.content{
  position:relative;z-index:5;text-align:center;
  padding:2.2rem 1.6rem;max-width:420px;
  animation:riseIn 1.2s ease forwards;opacity:0;
}
@keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.script-title{font-family:'Great Vibes',cursive;font-size:1.9rem;color:#ffd9d9;text-shadow:0 0 20px rgba(255,120,120,0.5);margin-bottom:0.4rem;}

.card{
  background:rgba(60,10,18,0.55);
  border:1px solid rgba(255,150,150,0.25);
  border-radius:22px;padding:2rem 1.6rem;
  box-shadow:0 20px 50px rgba(60,0,10,0.4);
}

.title{font-size:1.3rem;color:#fff;font-weight:600;margin-bottom:0.8rem;line-height:1.5;}
.title span{color:#ff8a8a;}

.sub{font-size:0.9rem;color:rgba(255,225,225,0.75);font-style:italic;line-height:1.8;margin-bottom:1.6rem;}

.inp{
  width:100%;font-family:'Playfair Display',serif;font-size:1rem;
  padding:0.85rem 1rem;border-radius:14px;border:1px solid rgba(255,150,150,0.35);
  background:rgba(255,255,255,0.06);color:#fff;text-align:center;
  margin-bottom:1.2rem;outline:none;cursor:pointer;
}
.inp::placeholder{color:rgba(255,220,220,0.4);}
.inp:focus{border-color:#ff8a8a;box-shadow:0 0 14px rgba(255,120,120,0.3);}

.calendar{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,150,150,0.3);
  border-radius:16px;padding:0.9rem;margin:-0.4rem 0 1.2rem;
  animation:calOpen 0.25s ease forwards;
}
@keyframes calOpen{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem;}
.cal-header button{
  background:rgba(220,50,60,0.25);border:1px solid rgba(255,150,150,0.4);
  color:#ffe8e8;width:28px;height:28px;border-radius:50%;cursor:pointer;
  font-size:0.85rem;line-height:1;
}
.cal-header button:hover{background:rgba(220,50,60,0.42);}
.cal-title{color:#ffd9d9;font-size:0.9rem;font-style:italic;}
.cal-weekdays,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-weekdays{margin-bottom:4px;}
.cal-weekdays span{color:rgba(255,200,200,0.5);font-size:0.62rem;text-align:center;}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:0.8rem;color:rgba(255,235,235,0.85);
  cursor:pointer;border:1px solid transparent;background:transparent;
  font-family:'Playfair Display',serif;
}
.cal-day:hover{background:rgba(255,150,150,0.15);}
.cal-day.other-month{color:rgba(255,200,200,0.25);}
.cal-day.selected{background:rgba(220,50,60,0.5);border-color:#ff8a8a;color:#fff;font-weight:600;}

.send-btn{
  width:100%;background:rgba(220,50,60,0.28);
  border:1px solid rgba(255,150,150,0.5);color:#ffe8e8;
  font-family:'Playfair Display',serif;font-style:italic;font-size:0.95rem;
  padding:0.8rem;border-radius:14px;cursor:pointer;transition:all 0.3s;
}
.send-btn:hover{background:rgba(220,50,60,0.42);}

.err{
  margin-top:1rem;font-size:0.8rem;color:#ffb3b3;min-height:18px;
  font-style:italic;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="fallLayer"></div>

<div class="content">
  <div class="script-title">Una pregunta antes de continuar</div>
  <div class="card">
    <div class="title">¿Recuerdas <span>esa fecha</span> tan especial para nosotros? 💭</div>
    <div class="sub">El primer día que nos vimos en Manizales...</div>
    <input type="text" class="inp" id="dateDisplay" placeholder="📅 Toca para elegir la fecha" readonly>
    <div class="calendar" id="calendar" style="display:none;">
      <div class="cal-header">
        <button id="prevMonth">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button id="nextMonth">›</button>
      </div>
      <div class="cal-weekdays">
        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
    <button class="send-btn" id="btnSend">Continuar ❤️</button>
    <div class="err" id="errMsg"></div>
  </div>
</div>

<script>
// 👉👉👉 FECHA CORRECTA YA CONFIGURADA: 9 de septiembre de 2025
const correctAnswers = ['09/09/2025'];
// 👉👉👉 Y AQUÍ EL LINK AL QUE PASA DESPUÉS (pantalla del escáner de huella)
const nextPage = 'huella.html';

// Fondo con partículas cálidas
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',()=>{resize();initParticles();});
function initParticles(){
  particles=[];
  const count=Math.floor((W*H)/9500);
  for(let i=0;i<count;i++){
    particles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+0.3,baseAlpha:Math.random()*0.5+0.2,speed:Math.random()*0.02+0.005,phase:Math.random()*Math.PI*2,driftY:-(Math.random()*0.15+0.03)});
  }
}
initParticles();
let t=0;
function draw(){
  ctx.clearRect(0,0,W,H); t+=1;
  particles.forEach(p=>{
    const alpha=p.baseAlpha+Math.sin(t*p.speed+p.phase)*0.25;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,170,150,${Math.max(0,Math.min(1,alpha))})`; ctx.fill();
    p.y+=p.driftY; if(p.y<0) p.y=H;
  });
  requestAnimationFrame(draw);
}
draw();

// Pétalos cayendo
const fallLayer=document.getElementById('fallLayer');
const items=['🌹','❤️','💗'];
for(let i=0;i<16;i++){
  const el=document.createElement('div');
  el.className='falling';
  el.textContent=items[Math.floor(Math.random()*items.length)];
  el.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*12}px;animation-duration:${7+Math.random()*7}s;animation-delay:${Math.random()*9}s;`;
  fallLayer.appendChild(el);
}

// Validación (no revela aquí si acertó — el resultado se guarda y se muestra tras el escáner)
const errMsg=document.getElementById('errMsg');
const dateDisplay=document.getElementById('dateDisplay');
const calendarEl=document.getElementById('calendar');
const calTitle=document.getElementById('calTitle');
const calDays=document.getElementById('calDays');

const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let viewYear=2025, viewMonth=8; // 8 = Septiembre (0-indexado)
let selectedDay=null, selectedMonth=null, selectedYear=null;

function renderCalendar(){
  calTitle.textContent=monthNames[viewMonth]+' '+viewYear;
  calDays.innerHTML='';
  const firstDay=new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth=new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth=new Date(viewYear, viewMonth, 0).getDate();

  for(let i=firstDay-1;i>=0;i--){
    const d=document.createElement('div');
    d.className='cal-day other-month';
    d.textContent=daysInPrevMonth-i;
    calDays.appendChild(d);
  }
  for(let day=1; day<=daysInMonth; day++){
    const d=document.createElement('div');
    d.className='cal-day';
    d.textContent=day;
    if(selectedDay===day && selectedMonth===viewMonth && selectedYear===viewYear){
      d.classList.add('selected');
    }
    d.addEventListener('click',()=>{
      selectedDay=day; selectedMonth=viewMonth; selectedYear=viewYear;
      dateDisplay.value = String(day).padStart(2,'0')+'/'+String(viewMonth+1).padStart(2,'0')+'/'+viewYear;
      calendarEl.style.display='none';
      errMsg.textContent='';
      renderCalendar();
    });
    calDays.appendChild(d);
  }
  const totalCells=firstDay+daysInMonth;
  const remaining=(7-(totalCells%7))%7;
  for(let i=1;i<=remaining;i++){
    const d=document.createElement('div');
    d.className='cal-day other-month';
    d.textContent=i;
    calDays.appendChild(d);
  }
}
renderCalendar();

dateDisplay.addEventListener('click',()=>{
  calendarEl.style.display = calendarEl.style.display==='none' ? 'block' : 'none';
});
document.getElementById('prevMonth').addEventListener('click',()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click',()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
  renderCalendar();
});

document.getElementById('btnSend').addEventListener('click',()=>{
  if(selectedDay===null){
    errMsg.textContent='Elige una fecha en el calendario para continuar...';
    return;
  }
  const val = String(selectedDay).padStart(2,'0')+'/'+String(selectedMonth+1).padStart(2,'0')+'/'+selectedYear;
  const isCorrect = correctAnswers.includes(val);
  sessionStorage.setItem('respuestaCorrecta', isCorrect ? 'si' : 'no');
  window.location.href = nextPage;
});
</script>
</body>
</html>
