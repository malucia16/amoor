<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Universo 💙</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#020308;}
body{font-family:'Playfair Display',serif;}
#canvasContainer{position:fixed;inset:0;z-index:1;}
canvas{display:block;}

#hint{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  color:rgba(200,220,255,0.65);font-size:0.72rem;letter-spacing:0.05em;
  background:rgba(10,20,45,0.45);border:1px solid rgba(140,180,255,0.2);
  padding:0.5rem 1.1rem;border-radius:30px;z-index:10;
  text-align:center;pointer-events:none;
  animation:hintFade 6s ease forwards;
}
@keyframes hintFade{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}

#loading{
  position:fixed;inset:0;background:#020308;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9fc1ff;font-size:0.85rem;letter-spacing:0.1em;gap:1rem;
  transition:opacity 0.8s;
}
.loader-heart{font-size:2rem;animation:pulseHeart 1s ease-in-out infinite;}
@keyframes pulseHeart{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

/* ===== MODAL DE INFORMACIÓN DEL PLANETA ===== */
#overlay{
  position:fixed;inset:0;background:rgba(2,4,10,0.72);backdrop-filter:blur(4px);
  z-index:50;display:none;align-items:center;justify-content:center;padding:1.2rem;
}
#overlay.show{display:flex;}
#infoCard{
  background:linear-gradient(160deg,rgba(15,26,55,0.96),rgba(8,14,32,0.98));
  border:1px solid rgba(140,180,255,0.25);
  border-radius:22px;
  max-width:380px;width:100%;
  padding:2rem 1.8rem 1.8rem;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,10,40,0.6);
  position:relative;
  animation:cardIn 0.4s ease forwards;
  max-height:88vh;overflow-y:auto;
}
@keyframes cardIn{from{opacity:0;transform:scale(0.92) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}

#closeBtn{
  position:absolute;top:14px;right:16px;background:none;border:none;
  color:rgba(200,220,255,0.6);font-size:1.3rem;cursor:pointer;line-height:1;
}
#closeBtn:hover{color:#fff;}

.icon-wrap{width:70px;height:70px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;}
.icon-wrap svg{width:100%;height:100%;}

#planetName{font-size:1.5rem;color:#fff;font-weight:600;margin-bottom:0.15rem;}
#planetCategory{
  display:inline-block;font-size:0.68rem;letter-spacing:0.25em;text-transform:uppercase;
  color:#9fc1ff;border:1px solid rgba(150,190,255,0.3);border-radius:30px;
  padding:0.32rem 1rem;margin-bottom:1.3rem;background:rgba(70,110,200,0.1);
}
#planetMsg{font-size:1rem;color:rgba(225,232,255,0.9);font-style:italic;line-height:1.85;}

.dots-nav{margin-top:1.6rem;font-size:0.68rem;color:rgba(180,200,255,0.4);letter-spacing:0.05em;}
</style>
</head>
<body>

<div id="loading">
  <div class="loader-heart">💙</div>
  <div>Formando nuestro universo...</div>
</div>

<div id="canvasContainer"></div>
<div id="hint">✦ Arrastra para girar · Rueda para zoom · Toca un planeta ✦</div>

<div id="overlay">
  <div id="infoCard">
    <button id="closeBtn">✕</button>
    <div class="icon-wrap" id="iconWrap"></div>
    <div id="planetName"></div>
    <div id="planetCategory"></div>
    <div id="planetMsg"></div>
    <div class="dots-nav">toca otro planeta para seguir explorando ✦</div>
  </div>
</div>

/* ============ ESCENA THREE.JS ============ */
const container=document.getElementById('canvasContainer');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x020308, 0.0032);

const camera=new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 34, 68);

const renderer=new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.minDistance=14;
controls.maxDistance=140;
controls.enablePan=true;
controls.autoRotate=true;
controls.autoRotateSpeed=0.25;

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===== Luces ===== */
scene.add(new THREE.AmbientLight(0x3a4a7a, 0.55));
const sunLight=new THREE.PointLight(0xffe0a0, 3.2, 300, 1.5);
scene.add(sunLight);

/* ===== Estrellas de fondo ===== */
function buildStarfield(){
  const geo=new THREE.BufferGeometry();
  const count=2600;
  const positions=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=140+Math.random()*260;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos((Math.random()*2)-1);
    positions[i*3]=r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1]=r*Math.cos(phi)*0.6;
    positions[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({color:0xbdd0ff, size:0.7, transparent:true, opacity:0.75, sizeAttenuation:true});
  scene.add(new THREE.Points(geo,mat));
}
buildStarfield();

/* ===== Texturas procedurales ===== */
function makeCanvas(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  return {c, ctx:c.getContext('2d')};
}
function colorToRgb(hex){
  return [(hex>>16)&255, (hex>>8)&255, hex&255];
}
function shade(rgb, amt){
  return `rgb(${Math.max(0,Math.min(255,rgb[0]+amt))},${Math.max(0,Math.min(255,rgb[1]+amt))},${Math.max(0,Math.min(255,rgb[2]+amt))})`;
}

function textureCratered(baseColor){
  const {c,ctx}=makeCanvas(256,128);
  const rgb=colorToRgb(baseColor);
  ctx.fillStyle=shade(rgb,0); ctx.fillRect(0,0,256,128);
  for(let i=0;i<140;i++){
    const x=Math.random()*256, y=Math.random()*128, r=Math.random()*4+1;
    ctx.fillStyle=shade(rgb, (Math.random()-0.5)*70);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
function textureBanded(baseColor){
  const {c,ctx}=makeCanvas(256,128);
  const rgb=colorToRgb(baseColor);
  const bands=10;
  for(let i=0;i<bands;i++){
    ctx.fillStyle=shade(rgb, Math.sin(i*1.3)*45);
    ctx.fillRect(0, i*(128/bands), 256, 128/bands+1);
  }
  for(let i=0;i<40;i++){
    ctx.fillStyle=shade(rgb,(Math.random()-0.5)*30);
    ctx.globalAlpha=0.3;
    ctx.fillRect(Math.random()*256, Math.random()*128, 30+Math.random()*40, 3+Math.random()*4);
  }
  ctx.globalAlpha=1;
  return new THREE.CanvasTexture(c);
}
function textureSmooth(baseColor){
  const {c,ctx}=makeCanvas(256,128);
  const rgb=colorToRgb(baseColor);
  const grad=ctx.createLinearGradient(0,0,0,128);
  grad.addColorStop(0, shade(rgb,30));
  grad.addColorStop(0.5, shade(rgb,0));
  grad.addColorStop(1, shade(rgb,-30));
  ctx.fillStyle=grad; ctx.fillRect(0,0,256,128);
  for(let i=0;i<10;i++){
    ctx.fillStyle=shade(rgb, 25);
    ctx.globalAlpha=0.15;
    ctx.beginPath();
    ctx.ellipse(Math.random()*256, Math.random()*128, 30+Math.random()*30, 8+Math.random()*8, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  return new THREE.CanvasTexture(c);
}
function textureEarth(){
  const {c,ctx}=makeCanvas(256,128);
  ctx.fillStyle='#1f4f8f'; ctx.fillRect(0,0,256,128);
  ctx.fillStyle='#2f7a4a';
  for(let i=0;i<9;i++){
    ctx.beginPath();
    ctx.ellipse(Math.random()*256, Math.random()*128, 18+Math.random()*24, 10+Math.random()*14, Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.ellipse(Math.random()*256, Math.random()*40, 22+Math.random()*20, 6+Math.random()*5, 0,0,Math.PI*2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
function textureRing(baseColor){
  const {c,ctx}=makeCanvas(256,32);
  const rgb=colorToRgb(baseColor);
  for(let x=0;x<256;x++){
    const a=0.25+Math.abs(Math.sin(x*0.15))*0.5;
    ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,32); ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}
function textureHeartGlow(){
  const {c,ctx}=makeCanvas(128,128);
  const grad=ctx.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'rgba(255,235,180,1)');
  grad.addColorStop(0.4,'rgba(255,200,110,0.55)');
  grad.addColorStop(1,'rgba(255,180,80,0)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* ===== SOL (forma natural) ===== */
function textureSun(){
  const {c,ctx}=makeCanvas(256,256);
  const grad=ctx.createRadialGradient(128,128,10,128,128,128);
  grad.addColorStop(0,'#fff3c4');
  grad.addColorStop(0.45,'#ffcf6b');
  grad.addColorStop(0.8,'#ff9d3a');
  grad.addColorStop(1,'#e4711f');
  ctx.fillStyle=grad; ctx.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){
    ctx.fillStyle=`rgba(255,${180+Math.floor(Math.random()*60)},${60+Math.floor(Math.random()*60)},0.25)`;
    ctx.beginPath();
    ctx.ellipse(Math.random()*256, Math.random()*256, 8+Math.random()*18, 4+Math.random()*8, Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

const sunGroup=new THREE.Group();
const sunGeo=new THREE.SphereGeometry(3.4, 48, 48);
const sunMat=new THREE.MeshStandardMaterial({
  map:textureSun(), emissive:0xff9d3a, emissiveIntensity:1.0, roughness:0.5, metalness:0.05
});
const sunMesh=new THREE.Mesh(sunGeo, sunMat);
sunGroup.add(sunMesh);

// halo de brillo detrás del sol
const glowMat=new THREE.SpriteMaterial({map:textureHeartGlow(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
const glowSprite=new THREE.Sprite(glowMat);
glowSprite.scale.set(16,16,1);
sunGroup.add(glowSprite);

// leve halo de partículas mágicas alrededor (esfera, no corazón)
function buildSunSparkles(){
  const count=500;
  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=3.9+Math.random()*1.4;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos((Math.random()*2)-1);
    positions[i*3]=r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2]=r*Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({color:0xffe3ab, size:0.14, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending, depthWrite:false});
  return new THREE.Points(geo,mat);
}
const sunSparkles=buildSunSparkles();
sunGroup.add(sunSparkles);
scene.add(sunGroup);
sunLight.position.set(0,0,0);

/* ===== PLANETAS + ÓRBITAS ===== */
const clickable=[]; // { mesh, data }
const planetMeshes={};

// Órbitas como anillos de polvo de estrellitas (muchos punticos juntos)
function buildOrbitLine(radius){
  const count=260;
  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2 + (Math.random()-0.5)*0.02;
    const jitter=(Math.random()-0.5)*0.35;
    const rr=radius+jitter;
    positions[i*3]=Math.cos(a)*rr;
    positions[i*3+1]=(Math.random()-0.5)*0.12;
    positions[i*3+2]=Math.sin(a)*rr;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({
    color:0x9fc1ff, size:0.16, transparent:true, opacity:0.55,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  });
  return new THREE.Points(geo, mat);
}

planetsData.forEach(pd=>{
  if(pd.isSun){
    clickable.push({mesh:sunMesh, data:pd});
    planetMeshes[pd.key]=sunGroup;
    return;
  }
  scene.add(buildOrbitLine(pd.radius));

  const orbit=new THREE.Group();
  orbit.rotation.y=Math.random()*Math.PI*2;
  orbit.userData.speed=pd.speed*0.12;
  scene.add(orbit);


  let tex;
  if(pd.texType==='cratered') tex=textureCratered(pd.color);
  else if(pd.texType==='banded') tex=textureBanded(pd.color);
  else if(pd.texType==='earth') tex=textureEarth();
  else tex=textureSmooth(pd.color);

  const geo=new THREE.SphereGeometry(pd.size, 32, 32);
  const mat=new THREE.MeshStandardMaterial({map:tex, roughness:0.85, metalness:0.05});
  const mesh=new THREE.Mesh(geo, mat);
  mesh.position.set(pd.radius, 0, 0);
  mesh.userData.selfSpin=0.004+Math.random()*0.006;
  orbit.add(mesh);

  if(pd.hasRing){
    const ringGeo=new THREE.RingGeometry(pd.size*1.5, pd.size*2.5, 64);
    const ringTex=textureRing(pd.color);
    const ringMat=new THREE.MeshBasicMaterial({map:ringTex, side:THREE.DoubleSide, transparent:true});
    const ring=new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x=Math.PI/2 - 0.4;
    mesh.add(ring);
  }

  planetMeshes[pd.key]=orbit;
  clickable.push({mesh, data:pd});
});

/* ===== INTERACCIÓN: click / tap en planetas ===== */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let dragDist=0, downX=0, downY=0;

function onPointerDown(e){
  const p=e.touches? e.touches[0] : e;
  downX=p.clientX; downY=p.clientY; dragDist=0;
}
function onPointerMove(e){
  const p=e.touches? e.touches[0] : e;
  if(p) dragDist += Math.abs(p.clientX-downX)+Math.abs(p.clientY-downY);
}
function onPointerUp(e){
  if(dragDist>6) return; // fue un arrastre, no un click
  const p=e.changedTouches? e.changedTouches[0] : e;
  pointer.x=(p.clientX/window.innerWidth)*2-1;
  pointer.y=-(p.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const meshes=clickable.map(c=>c.mesh);
  const hits=raycaster.intersectObjects(meshes, false);
  if(hits.length){
    const hitMesh=hits[0].object;
    const found=clickable.find(c=>c.mesh===hitMesh);
    if(found) openInfo(found.data);
  }
}
renderer.domElement.addEventListener('mousedown', onPointerDown);
renderer.domElement.addEventListener('mousemove', onPointerMove);
renderer.domElement.addEventListener('mouseup', onPointerUp);
renderer.domElement.addEventListener('touchstart', onPointerDown, {passive:true});
renderer.domElement.addEventListener('touchmove', onPointerMove, {passive:true});
renderer.domElement.addEventListener('touchend', onPointerUp);

const overlay=document.getElementById('overlay');
const iconWrap=document.getElementById('iconWrap');
const planetName=document.getElementById('planetName');
const planetCategory=document.getElementById('planetCategory');
const planetMsg=document.getElementById('planetMsg');
const infoCard=document.getElementById('infoCard');

function openInfo(pd){
  iconWrap.innerHTML=icons[pd.iconType](pd.accent);
  planetName.textContent=pd.name;
  planetCategory.textContent=pd.category;
  planetCategory.style.color=pd.accent;
  planetCategory.style.borderColor=pd.accent+'55';
  planetMsg.textContent=pd.msg;
  infoCard.style.boxShadow=`0 20px 60px rgba(0,10,40,0.6), 0 0 40px ${pd.accent}33`;
  overlay.classList.add('show');
  controls.autoRotate=false;
}
document.getElementById('closeBtn').addEventListener('click',()=>{
  overlay.classList.remove('show');
});
overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.classList.remove('show'); });

/* ===== LOOP DE ANIMACIÓN ===== */
document.getElementById('loading').style.opacity='0';
setTimeout(()=>{document.getElementById('loading').style.display='none';}, 900);

let clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  Object.values(planetMeshes).forEach(g=>{
    if(g===sunGroup) return;
    g.rotation.y += g.userData.speed*dt*4;
    if(g.children[0]) g.children[0].rotation.y += g.children[0].userData.selfSpin;
  });

  const t=clock.getElapsedTime();
  const pulse=1+Math.sin(t*1.4)*0.03;
  sunMesh.scale.set(pulse,pulse,pulse);
  sunMesh.rotation.y += 0.03*dt;
  glowSprite.scale.set(16*pulse,16*pulse,1);
  sunSparkles.rotation.y += 0.08*dt;
  sunSparkles.rotation.x += 0.03*dt;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
