<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felices 6 Meses 💙</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;}
body{
  background:radial-gradient(ellipse at 50% 20%,#0d1b3a 0%,#060a1a 55%,#020308 100%);
  font-family:'Playfair Display',serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}

#stars{position:fixed;top:0;left:0;z-index:0;}

.nebula{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 500px 300px at 20% 30%, rgba(60,110,220,0.15), transparent 60%),
    radial-gradient(ellipse 400px 400px at 80% 70%, rgba(90,60,220,0.12), transparent 60%),
    radial-gradient(ellipse 350px 250px at 60% 15%, rgba(50,150,255,0.1), transparent 60%);
}

.content{
  position:relative;z-index:5;
  text-align:center;
  padding:2.4rem 1.6rem;
  max-width:440px;
  animation:riseIn 1.6s ease forwards;
  opacity:0;
}
@keyframes riseIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

#heartCanvas{filter:drop-shadow(0 0 6px rgba(120,170,255,0.3));}

.badge{
  display:inline-block;color:#9fc1ff;font-size:0.7rem;letter-spacing:0.3em;
  text-transform:uppercase;border:1px solid rgba(150,190,255,0.3);
  padding:0.4rem 1.2rem;border-radius:50px;margin-top:0.4rem;margin-bottom:1.6rem;
  background:rgba(70,110,200,0.08);
}

.title{
  font-size:1.9rem;color:#fff;font-weight:600;line-height:1.4;
  text-shadow:0 0 30px rgba(120,160,255,0.5);margin-bottom:0.4rem;
}
.title span{color:#8fb8ff;}

.msg{
  margin-top:1.6rem;font-size:1.02rem;color:rgba(220,230,255,0.88);
  font-style:italic;line-height:1.9;
}
.msg .highlight{
  display:block;margin-top:0.5rem;font-size:1.12rem;color:#a8c8ff;font-weight:600;
  font-style:normal;text-shadow:0 0 20px rgba(140,180,255,0.5);
}

.signature{
  margin-top:1.8rem;font-size:0.78rem;color:rgba(180,200,255,0.55);
  letter-spacing:0.06em;
}

.enter-btn{
  margin-top:2.4rem;background:rgba(70,120,220,0.15);
  border:1px solid rgba(140,180,255,0.4);color:#cfe0ff;
  font-family:'Playfair Display',serif;font-style:italic;font-size:0.95rem;
  padding:0.75rem 2.4rem;border-radius:50px;cursor:pointer;
  letter-spacing:0.05em;transition:all 0.3s;
}
.enter-btn:hover{background:rgba(70,120,220,0.3);box-shadow:0 0 24px rgba(100,150,255,0.35);}

.hint{margin-top:1rem;font-size:0.68rem;color:rgba(160,180,220,0.4);font-style:italic;}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="nebula"></div>

<div class="content">
  <canvas id="heartCanvas" width="160" height="150" style="display:block;margin:0 auto 1.4rem;"></canvas>

  <div class="badge">✦ Nuestro Universo ✦</div>

  <div class="title">Felices <span>6 Meses</span><br>amor de mi vida ✨</div>

  <div class="msg">
    Porque el mundo no es lo suficientemente<br>inmenso para expresar mi amor por ti...
    <span class="highlight">Necesito el universo completo 🌌</span>
  </div>

  <div class="signature">— Att: Lucía Torres, para Daniel Mahecha</div>

  <button class="enter-btn" id="enterBtn">Entrar a nuestro universo ↠</button>
</div>

<script>
/* ============ FONDO: ESTRELLAS + COMETAS ============ */
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
let W,H,stars=[],comets=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',()=>{resize();initStars();});

function initStars(){
  stars=[];
  const count=Math.floor((W*H)/5500);
  for(let i=0;i<count;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.6+0.3,
      baseAlpha:Math.random()*0.6+0.3,
      speed:Math.random()*0.02+0.005,
      phase:Math.random()*Math.PI*2,
      driftX:(Math.random()-0.5)*0.06,
      driftY:(Math.random()-0.5)*0.06
    });
  }
}
initStars();

function spawnComet(){
  const fromLeft=Math.random()<0.5;
  const startY=Math.random()*H*0.6;
  const angle=(Math.random()*0.35+0.15) * (fromLeft?1:-1); // gentle diagonal
  comets.push({
    x: fromLeft? -60 : W+60,
    y: startY,
    vx: (fromLeft?1:-1) * (0.9+Math.random()*0.7),
    vy: (0.4+Math.random()*0.4),
    life:0,
    maxLife: 220+Math.random()*120,
    len: 60+Math.random()*40,
    alphaPeak: 0.55+Math.random()*0.3
  });
}
setInterval(spawnComet, 6500+Math.random()*4000);
setTimeout(spawnComet, 2000);

let t=0;
function drawStars(){
  ctx.clearRect(0,0,W,H);
  t+=1;

  // Stars: twinkle + slow drift
  stars.forEach(s=>{
    const alpha=s.baseAlpha + Math.sin(t*s.speed + s.phase)*0.3;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,220,255,${Math.max(0,Math.min(1,alpha))})`;
    ctx.fill();
    s.x += s.driftX;
    s.y += s.driftY;
    if(s.x>W) s.x=0; if(s.x<0) s.x=W;
    if(s.y>H) s.y=0; if(s.y<0) s.y=H;
  });

  // Comets: soft glowing head + fading tail, drifting stealthily
  comets=comets.filter(c=>{
    c.life++;
    c.x+=c.vx; c.y+=c.vy;
    const progress=c.life/c.maxLife;
    const fadeAlpha = progress<0.15 ? progress/0.15 : (progress>0.8 ? (1-progress)/0.2 : 1);
    const alpha=c.alphaPeak*Math.max(0,fadeAlpha);

    const tailX=c.x - c.vx*c.len/Math.hypot(c.vx,c.vy);
    const tailY=c.y - c.vy*c.len/Math.hypot(c.vx,c.vy);
    const grad=ctx.createLinearGradient(c.x,c.y,tailX,tailY);
    grad.addColorStop(0, `rgba(210,230,255,${alpha})`);
    grad.addColorStop(1, `rgba(120,170,255,0)`);
    ctx.strokeStyle=grad;
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(c.x,c.y);
    ctx.lineTo(tailX,tailY);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(c.x,c.y,1.8,0,Math.PI*2);
    ctx.fillStyle=`rgba(230,240,255,${alpha})`;
    ctx.shadowColor='rgba(150,190,255,0.9)';
    ctx.shadowBlur=8;
    ctx.fill();
    ctx.shadowBlur=0;

    return c.life<c.maxLife;
  });

  requestAnimationFrame(drawStars);
}
drawStars();

/* ============ CORAZÓN DENSO Y CON MOVIMIENTO ============ */
const heartCanvas=document.getElementById('heartCanvas');
const hctx=heartCanvas.getContext('2d');
const hW=heartCanvas.width, hH=heartCanvas.height;

function heartPoint(a,scale){
  const x=scale*16*Math.pow(Math.sin(a),3);
  const y=-scale*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
  return {x,y};
}

const hcx=hW/2, hcy=hH/2+8, hscale=3.35;
let heartParticles=[];

// Outline (denser)
for(let i=0;i<180;i++){
  const a=(i/180)*Math.PI*2;
  const p=heartPoint(a,hscale);
  heartParticles.push({
    baseX:hcx+p.x, baseY:hcy+p.y,
    r:0.9+Math.random()*1.6,
    phase:Math.random()*Math.PI*2,
    speed:0.01+Math.random()*0.02,
    amp:1.2+Math.random()*1.6,
    alpha:0.55+Math.random()*0.45,
    color: Math.random()<0.15 ? '245,250,255' : '150,195,255'
  });
}
// Fill (interior, layered for volume)
for(let i=0;i<260;i++){
  const a=Math.random()*Math.PI*2;
  const rr=Math.pow(Math.random(),0.65); // bias toward center for denser core
  const p=heartPoint(a,hscale*rr);
  heartParticles.push({
    baseX:hcx+p.x, baseY:hcy+p.y,
    r:0.6+Math.random()*1.3,
    phase:Math.random()*Math.PI*2,
    speed:0.008+Math.random()*0.018,
    amp:0.8+Math.random()*1.4,
    alpha:0.3+Math.random()*0.5,
    color: Math.random()<0.1 ? '245,250,255' : '110,165,240'
  });
}

let ht=0;
function drawHeart(){
  hctx.clearRect(0,0,hW,hH);
  ht+=1;

  // gentle overall "breathing" pulse
  const pulse=1 + Math.sin(ht*0.02)*0.035;
  hctx.save();
  hctx.translate(hcx,hcy);
  hctx.scale(pulse,pulse);
  hctx.translate(-hcx,-hcy);

  heartParticles.forEach(p=>{
    const dx=Math.sin(ht*p.speed+p.phase)*p.amp;
    const dy=Math.cos(ht*p.speed*0.8+p.phase)*p.amp;
    const flick=0.7+Math.sin(ht*p.speed*2+p.phase)*0.3;
    hctx.beginPath();
    hctx.arc(p.baseX+dx, p.baseY+dy, p.r, 0, Math.PI*2);
    hctx.fillStyle=`rgba(${p.color},${p.alpha*flick})`;
    hctx.shadowColor='rgba(140,190,255,0.9)';
    hctx.shadowBlur=4;
    hctx.fill();
  });

  hctx.shadowBlur=0;
  hctx.restore();

  requestAnimationFrame(drawHeart);
}
drawHeart();

document.getElementById('enterBtn').addEventListener('click',()=>{
  window.location.href = 'sistemasolar.html';
});
</script>
</body>
</html>
